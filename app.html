    type="text/javascript">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      background: #020617;
      color: #f1f5f9;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #root {
      min-height: calc(100vh - 86px);
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 86px);
      color: #14b8a6;
      font-size: 18px;
    }

    /* Prescope footer */
    .prescope-site-footer {
      width: 100%;
      background: #020617;
      border-top: 1px solid #1e293b;
      padding: 28px 24px;
    }

    .prescope-footer-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 40px;
    }

    .prescope-footer-logo {
      color: #f1f5f9;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .prescope-footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 28px;
    }

    .prescope-footer-links a {
      color: #64748b;
      font-size: 14px;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .prescope-footer-links a:hover,
    .prescope-footer-links a:focus {
      color: #14b8a6;
    }

    .prescope-footer-copy {
      color: #475569;
      font-size: 13px;
      text-align: right;
      white-space: nowrap;
    }

    @media (max-width: 850px) {
      .prescope-footer-inner {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 18px;
        text-align: center;
      }

      .prescope-footer-links {
        gap: 16px 24px;
      }

      .prescope-footer-copy {
        text-align: center;
        white-space: normal;
      }
    }
  </style>
</head>

<body>
  <!-- React application -->
  <div id="root">
    <div class="loading">Loading Prescope™...</div>
  </div>

  <!-- Site footer: keep this outside #root -->
  <footer class="prescope-site-footer">
    <div class="prescope-footer-inner">
      <div class="prescope-footer-logo">Prescope™</div>

      <nav class="prescope-footer-links" aria-label="Footer navigation">
        <a href="/terms.html">Terms of Service</a>
        <a href="/privacy.html">Privacy Policy</a>
        <a href="/refunds.html">Refund Policy</a>
        <a href="/contact.html">Contact</a>
      </nav>

      <div class="prescope-footer-copy">
        © 2026 Prescope. All rights reserved.
      </div>
    </div>
  </footer>

  <!-- Browser storage compatibility -->
  <script>
    window.storage = window.storage || {
      async get(key) {
        return {
          value: window.localStorage.getItem(key)
        };
      },

      async set(key, value) {
        window.localStorage.setItem(key, value);

        return {
          key,
          value
        };
      },

      async delete(key) {
        window.localStorage.removeItem(key);

        return {
          key
        };
      }
    };
  </script>

  <!-- Prescope React application -->
  <script type="text/babel" src="/prescope.jsx"></script>

  <!-- Register service worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
